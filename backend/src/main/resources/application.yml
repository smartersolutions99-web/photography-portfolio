    username: postgres.lriewuvmorxriynuiziq
    password: DYIoazIP6MKdI3WE
    hikari:
      maximum-pool-size: 5
      # Supabase session pooler + JDBC: iskljuci server-side prepared statement kes
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      # Flyway upravlja semom; Hibernate je ne dira niti validira (izbjegava tz/type nijanse)
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
